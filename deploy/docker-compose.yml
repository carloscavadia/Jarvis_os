# JARVIS_OS — stack base seguro.
#
# El gateway es accesible desde la LAN, pero exige JARVIS_GATEWAY_API_KEY.
# MQTT queda enlazado a localhost por defecto. Para HUB físicos en la LAN, configura
# credenciales/TLS y cambia explícitamente la dirección de enlace.

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: jarvis-mqtt
    restart: always
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: jarvis-gateway
    restart: always
    env_file:
      - ../.env
    environment:
      # Sin zona horaria declarada, el contenedor vive en UTC y «recuérdame a
      # las 8» suena a las 10 en España.
      TZ: "${TZ:-Europe/Madrid}"
      JARVIS_TIMEZONE: "${JARVIS_TIMEZONE:-Europe/Madrid}"
      JARVIS_MQTT_HOST: mqtt
      JARVIS_GATEWAY_HOST: 0.0.0.0
      JARVIS_GATEWAY_PORT: "8080"
      JARVIS_VOICE_ENABLED: "${JARVIS_VOICE_ENABLED:-true}"
      JARVIS_STT_MODEL: "${JARVIS_STT_MODEL:-small}"
      JARVIS_STT_DEVICE: "${JARVIS_STT_DEVICE:-cpu}"
      JARVIS_STT_COMPUTE_TYPE: "${JARVIS_STT_COMPUTE_TYPE:-int8}"
      JARVIS_STT_DOWNLOAD_ROOT: /app/data/models
      JARVIS_GOALS_DB: /app/data/jarvis_goals.db
      JARVIS_OPENAI_USAGE_DB: /app/data/openai_usage.db
      JARVIS_TTS_VOICE: "${JARVIS_TTS_VOICE:-em_alex}"
      JARVIS_TTS_LANG_CODE: "${JARVIS_TTS_LANG_CODE:-e}"
      JARVIS_TTS_SPEED: "${JARVIS_TTS_SPEED:-1.0}"
      # Palabra de activación local. El modelo viene en la imagen; no descarga nada.
      JARVIS_WAKEWORD_ENABLED: "${JARVIS_WAKEWORD_ENABLED:-true}"
      JARVIS_WAKEWORD_THRESHOLD: "${JARVIS_WAKEWORD_THRESHOLD:-0.38}"
      JARVIS_WAKEWORD_VAD_THRESHOLD: "${JARVIS_WAKEWORD_VAD_THRESHOLD:-0}"
      JARVIS_WAKEWORD_MAX_STREAMS: "${JARVIS_WAKEWORD_MAX_STREAMS:-8}"
      # Conversación Realtime: desactivada mientras no se valide contra la API real.
      JARVIS_REALTIME_CONVERSATION_ENABLED: "${JARVIS_REALTIME_CONVERSATION_ENABLED:-false}"
      JARVIS_REALTIME_IDLE_SECONDS: "${JARVIS_REALTIME_IDLE_SECONDS:-90}"
      JARVIS_REALTIME_MAX_SESSIONS: "${JARVIS_REALTIME_MAX_SESSIONS:-2}"
      XDG_CACHE_HOME: /app/data/cache
      HF_HOME: /app/data/huggingface
      JARVIS_LLM_TIMEOUT: "${JARVIS_LLM_TIMEOUT:-120}"
      JARVIS_MAX_TOOL_OUTPUT: "${JARVIS_MAX_TOOL_OUTPUT:-8000}"
      JARVIS_GATEWAY_CORS_ORIGINS: "${JARVIS_GATEWAY_CORS_ORIGINS:-http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:5173,http://localhost:5173}"
      JARVIS_SMTP_HOST: "${JARVIS_SMTP_HOST:-}"
      JARVIS_SMTP_PORT: "${JARVIS_SMTP_PORT:-587}"
      JARVIS_SMTP_USER: "${JARVIS_SMTP_USER:-}"
      JARVIS_SMTP_PASS: "${JARVIS_SMTP_PASS:-}"
      JARVIS_EMAIL_FROM: "${JARVIS_EMAIL_FROM:-}"
      JARVIS_EMAIL_TO: "${JARVIS_EMAIL_TO:-}"
      JARVIS_AGENT_CONTROL_ENABLED: "${JARVIS_AGENT_CONTROL_ENABLED:-true}"
      JARVIS_WORKSPACE_ROOT: "${JARVIS_WORKSPACE_ROOT:-/app/workspace}"
      JARVIS_PACKAGE_INSTALL_ENABLED: "${JARVIS_PACKAGE_INSTALL_ENABLED:-true}"
      JARVIS_PACKAGE_INSTALL_MANAGERS: "${JARVIS_PACKAGE_INSTALL_MANAGERS:-pip}"
      JARVIS_PYTHON_EXECUTION_ENABLED: "${JARVIS_PYTHON_EXECUTION_ENABLED:-true}"
      JARVIS_PYTHON_EXECUTION_TIMEOUT_SECONDS: "${JARVIS_PYTHON_EXECUTION_TIMEOUT_SECONDS:-60}"
      JARVIS_INTERNET_ACCESS_ENABLED: "${JARVIS_INTERNET_ACCESS_ENABLED:-true}"
      JARVIS_WEB_REQUEST_TIMEOUT_SECONDS: "${JARVIS_WEB_REQUEST_TIMEOUT_SECONDS:-15}"
      JARVIS_WEB_MAX_DOWNLOAD_BYTES: "${JARVIS_WEB_MAX_DOWNLOAD_BYTES:-1048576}"
      JARVIS_HUD_WORKSPACE_ENABLED: "${JARVIS_HUD_WORKSPACE_ENABLED:-true}"
      # Navidrome NO se declara aquí a propósito. `environment` gana sobre
      # `env_file`, y `${JARVIS_NAVIDROME_URL:-}` se interpola desde el shell o
      # desde --env-file, nunca desde `env_file`. Un `docker compose up` sin
      # --env-file inyectaba la cadena vacía por encima del valor correcto de
      # ../.env: el cliente de música no se construía, las herramientas no se
      # registraban y JARVIS decía «no puedo reproducir audio» con la
      # configuración bien puesta.
      JARVIS_PROXMOX_URL: "${JARVIS_PROXMOX_URL:-https://192.168.68.201:8006}"
      JARVIS_PROXMOX_TOKEN_ID: "${JARVIS_PROXMOX_TOKEN_ID:-}"
      JARVIS_PROXMOX_TOKEN_SECRET: "${JARVIS_PROXMOX_TOKEN_SECRET:-}"
      JARVIS_PROXMOX_VERIFY_SSL: "${JARVIS_PROXMOX_VERIFY_SSL:-false}"
      JARVIS_CONNECTOR_DB: /app/data/jarvis_connectors.db
      JARVIS_PROACTIVE_EVENTS_DB: /app/data/jarvis_proactive_events.db
      JARVIS_MCP_DB: /app/data/jarvis_mcp.db
      JARVIS_SKILLS_DB: /app/data/jarvis_skills.db
      # Habilidades con código Python ejecutable. Apagadas: son código que
      # escribe el propio modelo, y el resto del sistema le niega esa vía a
      # propósito. Enciéndelas sólo si de verdad quieres esa capacidad.
      JARVIS_SKILLS_PYTHON_ENABLED: "${JARVIS_SKILLS_PYTHON_ENABLED:-false}"
    ports:
      - "8080:8080"
    volumes:
      - jarvis_data:/app/data
      - jarvis_workspace:/app/workspace
      - jarvis_packages:/app/.local
    depends_on:
      - mqtt
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: jarvis-caddy
    restart: always
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway

volumes:
  jarvis_data:
  jarvis_workspace:
  jarvis_packages:
  mqtt_data:
  mqtt_log:
  caddy_data:
  caddy_config:
