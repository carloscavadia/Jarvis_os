# Configuración mínima de Mosquitto para JARVIS_OS.
#
# ⚠️  Para DESARROLLO en red local. En producción/Internet:
#     - Desactiva allow_anonymous y usa un password_file.
#     - Habilita TLS (certificados) en un listener 8883.
#     - No expongas el broker sin cifrar fuera de la LAN.

listener 1883
allow_anonymous true

# MQTT sobre WebSocket (útil para clientes web/depuración).
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# --- Ejemplo para producción (descomenta y configura) ---
# listener 8883
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# allow_anonymous false
# password_file /mosquitto/config/passwd
