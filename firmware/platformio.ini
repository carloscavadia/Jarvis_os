; PlatformIO — firmware JARVIS para LilyGo T-A7670G (ESP32 + 4G LTE).
;
; Punto de voz tipo Alexa servido desde el servidor central de JARVIS_OS.
; Este esqueleto usa WiFi + MQTT. Para 4G, ver la sección comentada y TinyGSM.

[env:t-a7670g]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8        ; cliente MQTT
    bblanchon/ArduinoJson@^7           ; parseo/serializado JSON
    ; --- Para 4G LTE con el módem A7670G (descomenta cuando lo uses) ---
    ; vshymanskyy/TinyGSM@^0.12
    ; --- Para micrófono/altavoz I2S y pantalla, añade aquí sus librerías ---

build_flags =
    -DCORE_DEBUG_LEVEL=3
