name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JARVIS_GATEWAY_API_KEY: ci-test-key
      ANTHROPIC_API_KEY: ci-test-provider-key
      JARVIS_MQTT_ENABLED: "false"
      JARVIS_SCHEDULER_ENABLED: "false"
      JARVIS_MEMORY_DB: /tmp/jarvis-ci-memory.db
      JARVIS_TASKS_DB: /tmp/jarvis-ci-tasks.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e "./core[dev]" -e "./gateway[dev]"
      - name: Compile
        run: python -m compileall -q core gateway
      - name: Test
        run: python -m pytest core/tests gateway/tests
      - name: Check HUD JavaScript
        run: |
          python -c "from pathlib import Path; h=Path('clients/web-hud/index.html').read_text(); Path('/tmp/jarvis-hud.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/jarvis-hud.js

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t jarvis-os:ci .
      - name: Start gateway
        run: |
          docker run -d --name jarvis-ci -p 127.0.0.1:18080:8080 \
            -e JARVIS_GATEWAY_API_KEY=ci-test-key \
            -e ANTHROPIC_API_KEY=ci-test-provider-key \
            -e JARVIS_MQTT_ENABLED=false \
            -e JARVIS_SCHEDULER_ENABLED=false \
            jarvis-os:ci
      - name: Smoke test
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health \
              && curl --fail --silent http://127.0.0.1:18080/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs jarvis-ci
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs jarvis-ci
