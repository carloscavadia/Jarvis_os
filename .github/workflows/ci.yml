name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JARVIS_GATEWAY_API_KEY: ci-test-key
      JARVIS_MQTT_ENABLED: "false"
      JARVIS_SCHEDULER_ENABLED: "false"
      JARVIS_MEMORY_DB: /tmp/jarvis-ci-memory.db
      JARVIS_TASKS_DB: /tmp/jarvis-ci-tasks.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e "./core[dev]" -e "./gateway[dev]"
      - name: Compile
        run: python -m compileall -q core gateway
      - name: Test
        run: python -m pytest core/tests gateway/tests
