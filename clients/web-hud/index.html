<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JARVIS HUD</title>
<style>
  /* HUD de JARVIS — enjambre de partículas reactivo. Tema oscuro deliberado (neón sobre negro). */
  :root {
    --ground:     #04070e;
    --panel:      rgba(9, 18, 28, 0.55);
    --hairline:   rgba(63, 224, 255, 0.16);
    --hairline-2: rgba(63, 224, 255, 0.30);
    --core:       #35e6ff;
    --core-bright:#c6f6ff;
    --text:       #cfe6f0;
    --muted:      #6b8a99;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; inset: 0; display: block; }

  .frame { position: fixed; inset: 0; pointer-events: none; }
  .bracket { position: absolute; width: 46px; height: 46px; border: 1px solid var(--hairline-2); }
  .bracket.tl { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
  .bracket.tr { top: 18px; right: 18px; border-left: 0; border-bottom: 0; }
  .bracket.bl { bottom: 18px; left: 18px; border-right: 0; border-top: 0; }
  .bracket.br { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }

  .readout {
    position: fixed; top: 30px; left: 42px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted); line-height: 2.1; pointer-events: none;
  }
  .readout .val { color: var(--text); }
  .readout .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--core); margin-right: 7px; vertical-align: middle; box-shadow: 0 0 8px var(--core); }
  .readout .state { color: var(--core); }

  .brand {
    position: fixed; top: 28px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); letter-spacing: 0.55em; font-size: 13px;
    color: var(--core-bright); text-shadow: 0 0 16px rgba(53,230,255,0.55);
    pointer-events: none; padding-left: 0.55em;
  }

  .console {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    width: min(680px, 90vw);
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 14px;
    backdrop-filter: blur(6px); box-shadow: 0 0 40px rgba(0,0,0,0.45); overflow: hidden;
  }
  .action-trace { display: none; position: fixed; z-index: 4; top: 28px; right: 28px;
    width: min(430px, calc(100vw - 56px)); max-height: min(68vh, 620px); overflow: hidden;
    border: 1px solid var(--hairline-2); border-radius: 12px; background: rgba(4,12,21,.84);
    backdrop-filter: blur(14px); box-shadow: 0 18px 65px rgba(0,0,0,.48), 0 0 28px rgba(53,230,255,.06);
    transform-origin: top right; }
  .action-trace.active { display: flex; flex-direction: column; animation: workspace-in .32s cubic-bezier(.2,.8,.2,1); }
  .action-trace::before { content: ""; position: absolute; inset: 0 auto auto 0; width: 54px; height: 1px;
    background: var(--core); box-shadow: 0 0 12px var(--core); pointer-events: none; }
  .action-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center;
    justify-content: space-between; min-height: 38px; padding: 9px 11px 8px 13px;
    border-bottom: 1px solid var(--hairline); background: rgba(4,12,21,.94);
    font-family: var(--mono); font-size: 9px; letter-spacing: .18em; color: var(--muted); }
  .action-close { width: 25px; height: 25px; border: 1px solid var(--hairline); border-radius: 50%;
    background: rgba(9,22,32,.72); color: var(--muted); cursor: pointer; font: 14px/1 var(--mono);
    transition: color .16s, border-color .16s, transform .16s, box-shadow .16s; }
  .action-close:hover { color: var(--core-bright); border-color: var(--core); transform: rotate(90deg);
    box-shadow: 0 0 14px rgba(53,230,255,.18); }
  #action-list { flex: 1 1 auto; min-height: 72px; max-height: min(52vh, 480px); overflow: auto; padding: 11px 12px;
    scrollbar-width: thin; scrollbar-color: var(--hairline-2) transparent; }
  .action-card { border-left: 2px solid var(--hairline-2); padding: 8px 10px;
    background: rgba(13,28,39,.48); font-family: var(--mono); font-size: 10px; color: var(--text);
    animation: card-scan .28s ease-out; }
  .action-card.running { border-color: var(--core); box-shadow: inset 8px 0 18px rgba(53,230,255,.04); }
  .action-card.completed { border-color: rgba(96,236,168,.75); }
  .action-card.error, .action-card.denied { border-color: rgba(255,180,96,.8); }
  .action-title { display: flex; justify-content: space-between; gap: 12px; letter-spacing: .08em; }
  .action-status { color: var(--core); }
  .action-meta { margin-top: 4px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .action-code, .action-output { margin: 7px 0 0; max-height: 140px; overflow: auto;
    padding: 7px 8px; border: 1px solid var(--hairline); border-radius: 6px;
    background: rgba(0,3,8,.78); color: #c9f7ff; white-space: pre; tab-size: 2; }
  .action-presentation { margin: 9px 0 0; max-height: min(42vh, 380px); overflow: auto;
    padding: 10px 11px; border: 1px solid rgba(53,230,255,.2); border-radius: 6px;
    background: rgba(0,3,8,.82); color: #d8f8ff; white-space: pre-wrap; overflow-wrap: anywhere;
    line-height: 1.55; scrollbar-width: thin; scrollbar-color: var(--hairline-2) transparent; }
  .action-presentation.code, .action-presentation.json, .action-presentation.table {
    font-family: var(--mono); white-space: pre; overflow-wrap: normal; tab-size: 2; }
  .approval-actions { display: flex; gap: 8px; padding: 10px 12px 12px;
    border-top: 1px solid var(--hairline); background: rgba(3,10,18,.94); }
  .approval-actions[hidden] { display: none; }
  .approval-actions button { flex: 1; min-height: 36px; border: 1px solid var(--hairline-2);
    border-radius: 7px; background: rgba(12,29,40,.72); color: var(--text); cursor: pointer;
    font: 10px var(--mono); letter-spacing: .14em; transition: .17s ease; }
  .approval-actions .approve { color: #baffdf; border-color: rgba(96,236,168,.48); }
  .approval-actions .deny { color: #ffd4ac; border-color: rgba(255,180,96,.46); }
  .approval-actions button:hover { transform: translateY(-1px); background: rgba(24,50,61,.86);
    box-shadow: 0 0 18px rgba(53,230,255,.12); }
  .approval-actions button:disabled { opacity: .35; cursor: wait; transform: none; }
  @keyframes workspace-in { from { opacity: 0; transform: translate(10px,-6px) scale(.97); filter: blur(3px); }
    to { opacity: 1; transform: translate(0) scale(1); filter: blur(0); } }
  @keyframes card-scan { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: none; } }
  .log { max-height: clamp(78px, 11vh, 112px); overflow-y: auto; padding: 10px 16px 8px;
    display: flex; flex-direction: column; gap: 7px; font-size: 14px; line-height: 1.4;
    scrollbar-width: none; }
  .log.has-history {
    mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.3) 14%, #000 38%, #000 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.3) 14%, #000 38%, #000 100%); }
  .log::-webkit-scrollbar { display: none; }
  .line { display: flex; gap: 10px; transform-origin: left center;
    transition: opacity .3s ease, filter .3s ease, transform .3s ease; }
  .line .who { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--muted); min-width: 58px; padding-top: 3px; }
  .line.jarvis .who { color: var(--core); }
  .line .txt { flex: 1; color: var(--text); }
  .line.jarvis .txt { color: var(--core-bright); }
  .line.system .txt { color: var(--muted); font-style: italic; }
  .line.history-current { opacity: 1; filter: blur(0); transform: translateX(0); }
  .line.history-current.jarvis .txt { color: #effdff; font-size: 15.5px; font-weight: 450;
    text-shadow: 0 0 18px rgba(53,230,255,.16); }
  .line.history-near { opacity: .48; filter: blur(.25px); transform: translateX(-1px); }
  .line.history-mid { opacity: .24; filter: blur(.65px); transform: translateX(-2px); }
  .line.history-old { opacity: .10; filter: blur(1.2px); transform: translateX(-3px); }
  .line.streaming .txt::after {
    content: ""; display: inline-block; width: 7px; height: 1em; margin-left: 3px;
    vertical-align: -0.16em; background: var(--core); box-shadow: 0 0 10px var(--core);
    animation: stream-cursor .75s steps(1) infinite;
  }
  .stream-token {
    display: inline; opacity: 0; color: #fff; text-shadow: 0 0 12px var(--core);
    animation: karaoke-in .34s ease-out forwards;
  }
  @keyframes karaoke-in {
    0% { opacity: 0; filter: blur(3px); }
    45% { opacity: 1; color: #fff; text-shadow: 0 0 14px var(--core); }
    100% { opacity: 1; color: var(--core-bright); filter: blur(0); text-shadow: none; }
  }
  @keyframes stream-cursor { 0%, 48% { opacity: 1; } 49%, 100% { opacity: .15; } }

  .inputbar { height: 46px; display: flex; align-items: center; gap: 10px;
    padding: 6px 14px; border-top: 1px solid var(--hairline); }
  .inputbar .prompt { font-family: var(--mono); color: var(--core); font-size: 14px; }
  .inputbar input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text);
    font-family: var(--sans); font-size: 15px; padding: 6px 0; }
  .inputbar input::placeholder { color: var(--muted); }
  .inputbar input:disabled { opacity: .55; cursor: wait; }
  .voice-btn { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center;
    border: 1px solid var(--hairline); border-radius: 50%; color: var(--muted);
    background: rgba(9,18,28,.46); cursor: pointer; font-size: 15px;
    transition: color .18s, border-color .18s, background .18s, box-shadow .18s, transform .18s; }
  .voice-btn:hover { color: var(--core); border-color: var(--hairline-2); }
  .voice-btn:focus-visible { outline: 2px solid var(--core); outline-offset: 2px; }
  .voice-btn.active { color: #effdff; border-color: var(--core); background: rgba(53,230,255,.12);
    box-shadow: 0 0 18px rgba(53,230,255,.34); transform: scale(1.06); }
  .voice-btn:disabled { opacity: .25; cursor: not-allowed; }

  .controls { position: fixed; left: 24px; bottom: 30px; display: flex; flex-direction: column; gap: 7px; width: 176px; }
  .controls .grp { display: flex; gap: 6px; flex-wrap: wrap; }
  .controls button, .controls input {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--muted); background: rgba(9,18,28,0.5); border: 1px solid var(--hairline);
    border-radius: 7px; padding: 6px 8px; cursor: pointer; transition: color .15s, border-color .15s, box-shadow .15s; }
  .controls input { text-transform: none; width: 100%; color: var(--text); cursor: text; }
  .controls button:hover { color: var(--core); border-color: var(--hairline-2); box-shadow: 0 0 12px rgba(53,230,255,0.15); }
  .controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--core); outline-offset: 2px; }
  .controls .cap { font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .connector-panel { display: none; position: fixed; z-index: 8; inset: 50% auto auto 50%;
    transform: translate(-50%,-50%); width: min(620px, calc(100vw - 36px)); max-height: 84vh;
    overflow: auto; padding: 16px; border: 1px solid var(--hairline-2); border-radius: 13px;
    background: rgba(4,12,21,.96); backdrop-filter: blur(18px); box-shadow: 0 24px 90px rgba(0,0,0,.72); }
  .connector-panel.active { display: block; animation: workspace-in .25s ease-out; }
  .connector-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px;
    font: 10px var(--mono); letter-spacing: .18em; color: var(--core); }
  .connector-form { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .connector-form label { display: grid; gap: 5px; font: 9px var(--mono); letter-spacing: .1em; color: var(--muted); }
  .connector-form .wide { grid-column: 1 / -1; }
  .connector-form input, .connector-form select { width: 100%; padding: 9px 10px; border: 1px solid var(--hairline);
    border-radius: 7px; outline: 0; background: rgba(8,20,30,.8); color: var(--text); font: 12px var(--mono); }
  .connector-actions { display: flex; gap: 8px; margin: 12px 0; }
  .connector-actions button, .module-card button { border: 1px solid var(--hairline-2); border-radius: 7px;
    padding: 8px 10px; background: rgba(12,29,40,.8); color: var(--text); cursor: pointer; font: 9px var(--mono); letter-spacing: .09em; }
  .connector-status { min-height: 20px; color: var(--muted); font: 10px var(--mono); }
  .module-list { display: grid; gap: 7px; }
  .module-card { display: flex; align-items: center; gap: 10px; padding: 9px 10px;
    border-left: 2px solid var(--core); background: rgba(11,26,37,.58); font: 10px var(--mono); }
  .module-card .module-info { flex: 1; overflow-wrap: anywhere; }
  .goal-panel { display: none; position: fixed; z-index: 5; top: 28px; left: 28px;
    width: min(360px, calc(100vw - 56px)); padding: 12px; border: 1px solid var(--hairline-2);
    border-radius: 11px; background: rgba(4,12,21,.88); backdrop-filter: blur(14px);
    box-shadow: 0 16px 55px rgba(0,0,0,.48); font-family: var(--mono); }
  .goal-panel.active { display: block; animation: workspace-in .28s ease-out; }
  .goal-title { display: flex; justify-content: space-between; gap: 12px; color: var(--core-bright);
    font-size: 11px; letter-spacing: .08em; }
  .goal-progress { height: 3px; margin: 10px 0; background: rgba(53,230,255,.1); overflow: hidden; }
  .goal-progress span { display: block; height: 100%; background: var(--core); box-shadow: 0 0 12px var(--core); transition: width .35s ease; }
  .goal-steps { display: grid; gap: 6px; max-height: 32vh; overflow: auto; }
  .goal-step { display: grid; grid-template-columns: 14px 1fr; gap: 7px; color: var(--muted); font-size: 9px; line-height: 1.35; }
  .goal-step.completed { color: #a8efd0; } .goal-step.running { color: var(--core-bright); }
  .goal-step.failed { color: #ffd0a0; }
  .goal-controls { display: flex; gap: 6px; margin-top: 10px; }
  .goal-controls button { flex: 1; padding: 6px; border: 1px solid var(--hairline); border-radius: 6px;
    background: rgba(9,22,32,.72); color: var(--muted); cursor: pointer; font: 8px var(--mono); letter-spacing: .08em; }

  @media (max-width: 620px) { .controls { display: none; } .readout { font-size: 10px; top: 22px; left: 26px; }
    .action-trace { top: 18px; right: 18px; width: calc(100vw - 36px); max-height: 58vh; } }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="frame">
    <span class="bracket tl"></span><span class="bracket tr"></span>
    <span class="bracket bl"></span><span class="bracket br"></span>
  </div>
  <div class="brand">J.A.R.V.I.S</div>

  <div class="readout">
    <div><span class="dot" id="dot"></span>ESTADO · <span class="state" id="r-state">REPOSO</span></div>
    <div>EMOCIÓN · <span class="val" id="r-emotion">NEUTRAL</span></div>
    <div>ENLACE · <span class="val" id="r-link">DEMO</span></div>
    <div>RESPUESTA · <span class="val" id="r-latency">—</span></div>
    <div>VOZ · <span class="val" id="r-voice">LISTA</span></div>
  </div>

  <div class="controls">
    <div class="cap">Estados</div>
    <div class="grp">
      <button data-state="idle">Reposo</button>
      <button data-state="listening">Escucha</button>
      <button data-state="thinking">Pensar</button>
      <button data-state="speaking">Hablar</button>
    </div>
    <div class="cap">Emociones</div>
    <div class="grp">
      <button data-emotion="neutral">Neutral</button>
      <button data-emotion="happy">Feliz</button>
      <button data-emotion="alert">Alerta</button>
      <button data-emotion="focused">Foco</button>
      <button data-emotion="concern">Duda</button>
    </div>
    <div class="cap">Evento</div>
    <div class="grp"><button id="pulse">Ejecución ⚡</button></div>
    <div class="cap">Conexión</div>
    <div class="cap">192.168.68.100 · HUB TEST</div>
    <input id="ws-token" type="password" placeholder="Clave del HUB" autocomplete="current-password" />
    <button id="ws-connect">Conectar</button>
    <button id="connector-open">Conectores</button>
  </div>

  <section class="connector-panel" id="connector-panel" aria-label="Módulos de conectores">
    <div class="connector-head"><span>MÓDULOS DE CONECTORES</span><button class="action-close" id="connector-close" type="button">×</button></div>
    <div class="connector-form">
      <label>NOMBRE<input id="connector-name" placeholder="correo" maxlength="32" /></label>
      <label>TIPO<select id="connector-type"><option value="n8n">n8n / OAuth</option><option value="home_assistant">Home Assistant</option></select></label>
      <label class="wide">URL<input id="connector-url" placeholder="https://n8n.example.com/webhook/jarvis" /></label>
      <label class="wide">CLAVE / TOKEN<input id="connector-token" type="password" placeholder="Se cifra al guardarse" autocomplete="new-password" /></label>
      <label class="wide">SERVICIOS<input id="connector-services" placeholder="gmail,outlook,whatsapp" /></label>
      <label class="wide">ACCIONES DE LECTURA<input id="connector-read" placeholder="gmail.search,gmail.read" /></label>
      <label class="wide">ACCIONES CON APROBACIÓN<input id="connector-write" placeholder="gmail.send,gmail.reply" /></label>
    </div>
    <div class="connector-actions"><button id="connector-save">REGISTRAR</button><button id="connector-refresh">ACTUALIZAR</button></div>
    <div class="connector-status" id="connector-status"></div>
    <div class="module-list" id="module-list"></div>
  </section>

  <section class="goal-panel" id="goal-panel" aria-live="polite" aria-label="Objetivo activo de JARVIS">
    <div class="goal-title"><span id="goal-title">OBJETIVO</span><span id="goal-count">0/0</span></div>
    <div class="goal-progress"><span id="goal-progress"></span></div>
    <div class="goal-steps" id="goal-steps"></div>
    <div class="goal-controls"><button id="goal-resume">REANUDAR</button><button id="goal-block">BLOQUEAR</button><button id="goal-cancel">CANCELAR</button></div>
  </section>

  <section class="action-trace" id="action-trace" aria-live="polite" aria-label="Espacio de trabajo de JARVIS">
    <div class="action-head"><span>ESPACIO DE TRABAJO · JARVIS</span><button class="action-close" id="action-close" type="button" aria-label="Cerrar espacio de trabajo">×</button></div>
    <div id="action-list"></div>
    <div class="approval-actions" id="approval-actions" hidden>
      <button class="approve" id="approval-approve" type="button">APROBAR</button>
      <button class="deny" id="approval-deny" type="button">DENEGAR</button>
    </div>
  </section>

  <div class="console">
    <div class="log" id="log"></div>
    <form class="inputbar" id="form" autocomplete="off">
      <span class="prompt">&rsaquo;</span>
      <input id="input" placeholder="Habla con JARVIS…" aria-label="Mensaje" />
      <button class="voice-btn" id="voice-toggle" type="button" aria-label="Activar o silenciar voz" title="Voz de JARVIS">◖</button>
      <button class="voice-btn" id="mic" type="button" aria-label="Reintentar escucha Hey Jarvis" title="Reintentar escucha Hey Jarvis">●</button>
    </form>
  </div>

<script>
(() => {
  "use strict";

  // ── Emociones = color base del enjambre ──
  const EMOTIONS = {
    neutral: { r: 54,  g: 226, b: 214 },
    happy:   { r: 96,  g: 236, b: 168 },
    alert:   { r: 120, g: 240, b: 255 },
    focused: { r: 132, g: 150, b: 255 },
    concern: { r: 255, g: 180, b: 96  },
  };
  const EMO_LABEL = { neutral:"NEUTRAL", happy:"FELIZ", alert:"ALERTA", focused:"FOCO", concern:"DUDA" };
  // ── Estados = energía / comportamiento del enjambre ──
  const STATES = {
    idle:      { turb: 0.85, spin: 0.06, expand: 0.00, chaos: 1.0, label: "REPOSO" },
    listening: { turb: 1.05, spin: 0.10, expand: 0.07, chaos: 1.1, label: "ESCUCHANDO" },
    thinking:  { turb: 1.9,  spin: 0.28, expand: 0.02, chaos: 2.2, label: "PENSANDO" },
    speaking:  { turb: 1.25, spin: 0.12, expand: 0.03, chaos: 1.3, label: "HABLANDO" },
  };

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d", { alpha: false });
  const logEl = document.getElementById("log");
  const actionTrace = document.getElementById("action-trace");
  const actionList = document.getElementById("action-list");
  const approvalActions = document.getElementById("approval-actions");
  const approvalApprove = document.getElementById("approval-approve");
  const approvalDeny = document.getElementById("approval-deny");
  const rState = document.getElementById("r-state");
  const rEmotion = document.getElementById("r-emotion");
  const rLink = document.getElementById("r-link");
  const rLatency = document.getElementById("r-latency");
  const rVoice = document.getElementById("r-voice");
  const dot = document.getElementById("dot");
  const messageInput = document.getElementById("input");
  const micButton = document.getElementById("mic");
  const voiceToggle = document.getElementById("voice-toggle");
  const connectorPanel = document.getElementById("connector-panel");
  const connectorStatus = document.getElementById("connector-status");
  const moduleList = document.getElementById("module-list");
  const goalPanel = document.getElementById("goal-panel");
  const goalTitle = document.getElementById("goal-title");
  const goalCount = document.getElementById("goal-count");
  const goalProgress = document.getElementById("goal-progress");
  const goalSteps = document.getElementById("goal-steps");
  let currentGoal = null;

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // Fondo inicial (con alpha:false el buffer arranca en negro; lo dejamos explícito).
    ctx.fillStyle = "#04070e";
    ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener("resize", resize);
  resize();

  // ── Estado dinámico ──
  let stateName = "idle";
  let emotionName = "neutral";
  let col = { ...EMOTIONS.neutral };            // color interpolado
  let curTurb = STATES.idle.turb, curSpin = STATES.idle.spin,
      curExpand = 0, curChaos = STATES.idle.chaos;
  let amp = 0, speakClock = 0;                   // amplitud visual suavizada
  let voiceEnergy = 0, voiceActive = false;      // energía medida del audio real
  let voiceAnalyser = null, voiceWaveform = null;
  const pulses = [];                            // flares de ejecución

  function setState(next) {
    if (!STATES[next]) return;
    stateName = next;
    rState.textContent = STATES[next].label;
  }
  function setEmotion(next) {
    if (!EMOTIONS[next]) return;
    emotionName = next;
    rEmotion.textContent = EMO_LABEL[next];
  }
  function firePulse() { pulses.push({ r: 0, life: 1 }); }

  function measuredVoiceEnergy() {
    if (!voiceAnalyser || !voiceWaveform || !voiceActive) return null;
    voiceAnalyser.getByteTimeDomainData(voiceWaveform);
    let sum = 0;
    for (let i = 0; i < voiceWaveform.length; i++) {
      const sample = (voiceWaveform[i] - 128) / 128;
      sum += sample * sample;
    }
    const rms = Math.sqrt(sum / voiceWaveform.length);
    // Puerta de ruido y curva perceptual: conserva respiraciones sin exagerar picos.
    return Math.min(1, Math.max(0, (rms - 0.012) * 7.2));
  }

  let currentToolCard = null;
  let currentToolKey = "";
  let workspaceCloseTimer = null;
  const TOOL_LABELS = {
    create_directory: "CREAR CARPETA", create_file: "CREAR ARCHIVO",
    update_file: "MODIFICAR ARCHIVO", read_file: "LEER ARCHIVO",
    list_directory: "LISTAR CARPETA", install_package: "INSTALAR PAQUETE",
    run_python_file: "EJECUTAR PYTHON", system_info: "CONSULTAR SISTEMA",
    search_web: "BUSCAR EN INTERNET", fetch_web_page: "LEER FUENTE WEB",
    show_in_workspace: "PRESENTAR EN WORKSPACE",
    list_connectors: "LISTAR CONECTORES", query_connector: "CONSULTAR CONECTOR",
    run_connector_action: "EJECUTAR EN CONECTOR",
  };
  function safeToolMeta(args = {}) {
    const visible = {};
    for (const key of ["path", "mode", "manager", "package", "arguments", "content_bytes", "payload_bytes", "payload_preview", "query", "count", "url", "action", "format", "language", "keep_open"]) {
      if (args[key] !== undefined) visible[key] = args[key];
    }
    return Object.keys(visible).length ? JSON.stringify(visible) : "sin parámetros visibles";
  }
  function showToolEvent(event) {
    clearTimeout(workspaceCloseTimer); workspaceCloseTimer = null;
    actionTrace.classList.add("active");
    const key = event.tool + ":" + safeToolMeta(event.arguments);
    let card = currentToolCard;
    if (!currentToolCard || currentToolKey !== key || event.phase === "proposed") {
      actionList.replaceChildren();
      approvalActions.hidden = true;
      currentToolKey = key;
      card = document.createElement("div"); card.className = "action-card";
      const title = document.createElement("div"); title.className = "action-title";
      const label = document.createElement("span");
      label.textContent = event.presentation?.title || TOOL_LABELS[event.tool] || event.tool.toUpperCase();
      const status = document.createElement("span"); status.className = "action-status";
      title.append(label, status);
      const meta = document.createElement("div"); meta.className = "action-meta"; meta.textContent = safeToolMeta(event.arguments);
      card.append(title, meta); card._status = status;
      if (event.code) { const code = document.createElement("pre"); code.className = "action-code"; code.textContent = event.code; card.appendChild(code); }
      if (event.presentation) {
        const content = document.createElement("div");
        const format = ["text", "code", "json", "table", "markdown"].includes(event.presentation.format) ? event.presentation.format : "text";
        content.className = "action-presentation " + format;
        content.textContent = event.presentation.content || "";
        if (event.presentation.language) content.dataset.language = event.presentation.language;
        card.appendChild(content);
      }
      actionList.appendChild(card); currentToolCard = card;
    }
    const states = { proposed:"PREPARANDO", awaiting:"ESPERANDO PERMISO", running:"EJECUTANDO", completed:"COMPLETADO", denied:"DENEGADO" };
    const visualState = event.is_error ? "error" : event.phase;
    card.className = "action-card " + visualState;
    card._status.textContent = event.is_error ? "ERROR" : (states[event.phase] || event.phase.toUpperCase());
    let output = card.querySelector(".action-output");
    if (event.output !== undefined && !output) {
      output = document.createElement("pre"); output.className = "action-output"; output.textContent = event.output; card.appendChild(output);
    }
    requestAnimationFrame(() => {
      actionList.scrollTo({ top: actionList.scrollHeight, behavior: reduceMotion ? "auto" : "smooth" });
      if (output) output.scrollTop = output.scrollHeight;
    });
    if (["completed", "denied"].includes(event.phase) && !event.presentation?.keep_open) {
      workspaceCloseTimer = setTimeout(() => closeWorkspace(), 18000);
    }
    if (event.goal) showGoalProgress(event.goal);
  }

  function showGoalProgress(goal) {
    currentGoal = goal;
    const progress = goal.progress || { completed: 0, total: goal.steps?.length || 0 };
    goalPanel.classList.toggle("active", ["active", "blocked"].includes(goal.status));
    goalTitle.textContent = goal.title || "OBJETIVO";
    goalCount.textContent = `${goal.status === "blocked" ? "BLOQUEADO · " : ""}${progress.completed}/${progress.total}`;
    goalProgress.style.width = `${progress.total ? (progress.completed / progress.total) * 100 : 0}%`;
    goalSteps.replaceChildren();
    for (const step of goal.steps || []) {
      const row = document.createElement("div"); row.className = `goal-step ${step.status}`;
      const icon = document.createElement("span");
      icon.textContent = step.status === "completed" ? "✓" : step.status === "running" ? "›" : step.status === "failed" ? "!" : "·";
      const text = document.createElement("span"); text.textContent = step.title;
      row.append(icon, text); goalSteps.appendChild(row);
    }
    document.getElementById("goal-resume").hidden = goal.status !== "blocked";
    document.getElementById("goal-block").hidden = goal.status !== "active";
    if (!["active", "blocked"].includes(goal.status)) {
      setTimeout(() => goalPanel.classList.remove("active"), 4500);
    }
  }

  async function loadCurrentGoal() {
    try {
      const payload = await connectorRequest("/goals/current", { headers: connectorApiHeaders() });
      if (payload.goal) showGoalProgress(payload.goal);
    } catch {}
  }

  async function controlCurrentGoal(action) {
    if (!currentGoal?.goal_id) return;
    if (action === "cancel" && !confirm(`¿Cancelar el objetivo ${currentGoal.title}?`)) return;
    try {
      const goal = await connectorRequest(`/goals/${currentGoal.goal_id}/control`, {
        method: "POST", headers: connectorApiHeaders(true), body: JSON.stringify({ action }),
      });
      showGoalProgress(goal);
    } catch (error) { addLine("SISTEMA", `No pude ${action} el objetivo: ${error.message}`, "system"); }
  }
  document.getElementById("goal-resume").addEventListener("click", () => controlCurrentGoal("resume"));
  document.getElementById("goal-block").addEventListener("click", () => controlCurrentGoal("block"));
  document.getElementById("goal-cancel").addEventListener("click", () => controlCurrentGoal("cancel"));
  function closeWorkspace() {
    clearTimeout(workspaceCloseTimer); workspaceCloseTimer = null;
    actionTrace.classList.remove("active"); approvalActions.hidden = true;
    actionList.replaceChildren(); currentToolCard = null; currentToolKey = "";
  }
  document.getElementById("action-close").addEventListener("click", closeWorkspace);

  function refreshDot() {
    const hex = `rgb(${col.r|0},${col.g|0},${col.b|0})`;
    rState.style.color = hex; dot.style.background = hex; dot.style.boxShadow = `0 0 8px ${hex}`;
  }
  setState("idle"); setEmotion("neutral");

  const lerp = (a, b, t) => a + (b - a) * t;
  // pseudo-ruido por capas de senos (barato y orgánico)
  function noise(a, t) {
    return Math.sin(a * 3.0 + t * 0.7)  * 0.55
         + Math.sin(a * 6.3 - t * 1.15) * 0.30
         + Math.sin(a * 11.7 + t * 1.8) * 0.15
         + Math.sin(a * 19.1 - t * 2.6) * 0.08;
  }

  // ── Partículas: un anillo denso + polvo disperso ──
  // Anillo orgánico: muchas partículas pequeñas agrupadas en corrientes, sin malla.
  const RING = 1750, DUST = 320, N = RING + DUST;
  const P = new Array(N);
  for (let i = 0; i < N; i++) {
    const ring = i < RING;
    const lane = ring ? (i % 7) - 3 : 0;
    P[i] = {
      a: Math.random() * Math.PI * 2,
      band: ring
        ? lane * 0.010 + (Math.random() - 0.5) * 0.035
        : (Math.random() - 0.5) * 0.34,
      lane,
      seed: Math.random() * 6.28,
      spd: 0.72 + Math.random() * 0.46,
      sz: ring ? 0.65 + Math.random() * 1.15 : 0.45 + Math.random() * 0.85,
      bri: ring ? 0.28 + Math.random() * 0.58 : 0.10 + Math.random() * 0.26,
      scatter: 1.9 + Math.random() * 1.7,
      _x: 0, _y: 0, _f: 0, _s: 0,
    };
  }

  // Esfera central de partículas: densa, volumétrica y sin un punto sólido artificial.
  const CORE_N = 920;
  const CORE = new Array(CORE_N);
  for (let i = 0; i < CORE_N; i++) {
    const z = Math.random() * 2 - 1;
    const phi = Math.random() * Math.PI * 2;
    const radius = Math.cbrt(Math.random());
    const planar = Math.sqrt(1 - z * z);
    CORE[i] = {
      x: Math.cos(phi) * planar * radius,
      y: Math.sin(phi) * planar * radius,
      z: z * radius,
      seed: Math.random() * Math.PI * 2,
      size: 0.45 + Math.random() * 1.05,
      bri: 0.28 + Math.random() * 0.62,
    };
  }

  // sprite de partícula: halo AJUSTADO (caída rápida) para dar brillo sin difuminar.
  const SP = 22;
  const sprite = document.createElement("canvas");
  sprite.width = sprite.height = SP;
  const sctx = sprite.getContext("2d");
  let coreHex = "#eaffff";
  function paintSprite(r, g, b) {
    sctx.clearRect(0, 0, SP, SP);
    const grd = sctx.createRadialGradient(SP/2, SP/2, 0, SP/2, SP/2, SP/2);
    grd.addColorStop(0,    `rgba(${Math.min(255,r+120)|0},${Math.min(255,g+120)|0},${Math.min(255,b+120)|0},1)`);
    grd.addColorStop(0.28, `rgba(${r|0},${g|0},${b|0},0.65)`);
    grd.addColorStop(0.6,  `rgba(${r|0},${g|0},${b|0},0.12)`);
    grd.addColorStop(1,    "rgba(0,0,0,0)");
    sctx.fillStyle = grd; sctx.fillRect(0, 0, SP, SP);
    // color del núcleo sólido (casi blanco teñido) para el punto nítido
    coreHex = `rgb(${Math.min(255,r+140)|0},${Math.min(255,g+140)|0},${Math.min(255,b+140)|0})`;
  }

  // buffer de bloom (resplandor global) a baja resolución
  const glow = document.createElement("canvas");
  const gctx = glow.getContext("2d");
  function sizeGlow() { glow.width = Math.max(1, (W / 4) | 0); glow.height = Math.max(1, (H / 4) | 0); }
  sizeGlow();

  const TAU = Math.PI * 2;
  const TILT = 0.88;                          // inclinación del anillo (da profundidad 3D)
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  let t = 0, rot = 0, bootT = 0;

  // Núcleo profesional: esfera granular + campo de energía tenue.
  function drawCore(cx, cy, R, rgbCol, pulse) {
    ctx.globalCompositeOperation = "lighter";
    const sphereR = R * (0.125 + amp * 0.018);
    const haloR = sphereR * 2.7;

    const field = ctx.createRadialGradient(cx, cy, 0, cx, cy, haloR);
    field.addColorStop(0,   `rgba(${rgbCol},${0.11 + amp * 0.08})`);
    field.addColorStop(0.34,`rgba(${rgbCol},0.045)`);
    field.addColorStop(1,   "rgba(0,0,0,0)");
    ctx.globalAlpha = easeOut(bootT);
    ctx.fillStyle = field;
    ctx.beginPath(); ctx.arc(cx, cy, haloR, 0, TAU); ctx.fill();

    // Ondas concéntricas muy discretas: interfaz, no "átomo".
    ctx.strokeStyle = `rgb(${rgbCol})`;
    ctx.lineWidth = 0.7;
    for (let k = 0; k < 3; k++) {
      const wave = sphereR * (1.45 + k * 0.50 + pulse * 0.06);
      ctx.globalAlpha = (0.075 - k * 0.016) * easeOut(bootT);
      ctx.beginPath(); ctx.arc(cx, cy, wave, 0, TAU); ctx.stroke();
    }

    // Rotación 3D de la nube central.
    const ry = t * 0.34;
    const rx = t * 0.17;
    const cry = Math.cos(ry), sry = Math.sin(ry);
    const crx = Math.cos(rx), srx = Math.sin(rx);

    for (let i = 0; i < CORE_N; i++) {
      const p = CORE[i];
      const x1 = p.x * cry - p.z * sry;
      const z1 = p.x * sry + p.z * cry;
      const y1 = p.y * crx - z1 * srx;
      const z2 = p.y * srx + z1 * crx;
      const depth = 0.60 + (z2 + 1) * 0.20;
      const shimmer = 0.72 + 0.28 * Math.sin(t * 2.1 + p.seed);
      const px = cx + x1 * sphereR;
      const py = cy + y1 * sphereR;
      const pr = p.size * (0.72 + depth * 0.42) * (1 + amp * 0.22);

      ctx.globalAlpha = p.bri * depth * shimmer * easeOut(bootT);
      ctx.fillStyle = coreHex;
      ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();

      if (p.bri > 0.72) {
        ctx.globalAlpha *= 0.16;
        ctx.beginPath(); ctx.arc(px, py, pr * 3.2, 0, TAU); ctx.fill();
      }
    }
  }

  // Campo ambiental: luz muy tenue que deriva con el núcleo y reacciona al estado.
  function drawEnvironment(cx, cy, R, rgbCol, activity, pulse) {
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(4,7,14,0.48)";
    ctx.fillRect(0, 0, W, H);

    const motion = reduceMotion ? 0 : 1;
    const driftX = Math.sin(t * 0.19) * R * 0.18 * motion;
    const driftY = Math.cos(t * 0.14) * R * 0.10 * motion;
    const glowPower = 0.018 + activity * 0.012 + amp * 0.016 + pulse * 0.003;

    // La luz principal sigue al núcleo con un pequeño retraso orbital.
    const ambient = ctx.createRadialGradient(
      cx + driftX, cy + driftY, R * 0.06,
      cx + driftX, cy + driftY, R * (2.25 + activity * 0.12)
    );
    ambient.addColorStop(0, `rgba(${rgbCol},${glowPower})`);
    ambient.addColorStop(0.34, `rgba(${rgbCol},${glowPower * 0.48})`);
    ambient.addColorStop(0.72, `rgba(${rgbCol},${glowPower * 0.12})`);
    ambient.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = ambient; ctx.fillRect(0, 0, W, H);

    // Reflejo secundario en deriva opuesta: rompe la sensación de fondo fijo.
    const echo = ctx.createRadialGradient(
      cx - driftX * 1.7, cy - R * 0.15 - driftY, 0,
      cx - driftX * 1.7, cy - R * 0.15 - driftY, R * 1.55
    );
    echo.addColorStop(0, `rgba(${rgbCol},${glowPower * 0.24})`);
    echo.addColorStop(0.58, `rgba(${rgbCol},${glowPower * 0.07})`);
    echo.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = echo; ctx.fillRect(0, 0, W, H);

    // Sombra periférica suave para que la iluminación central tenga profundidad.
    const vignette = ctx.createRadialGradient(cx, cy, R * 0.82, cx, cy, Math.max(W, H) * 0.72);
    vignette.addColorStop(0, "rgba(0,0,0,0)");
    vignette.addColorStop(0.66, "rgba(0,2,8,0.06)");
    vignette.addColorStop(1, `rgba(0,2,8,${0.27 + activity * 0.025})`);
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  }

  function frame() {
    t += reduceMotion ? 0.004 : 0.016;
    bootT = Math.min(1, bootT + 0.010);
    const boot = easeOut(bootT);

    const S = STATES[stateName], E = EMOTIONS[emotionName];
    col.r = lerp(col.r, E.r, 0.05); col.g = lerp(col.g, E.g, 0.05); col.b = lerp(col.b, E.b, 0.05);
    curTurb = lerp(curTurb, S.turb, 0.05);
    curSpin = lerp(curSpin, S.spin, 0.05);
    curExpand = lerp(curExpand, S.expand, 0.05);
    curChaos = lerp(curChaos, S.chaos, 0.05);
    refreshDot();

    const measured = measuredVoiceEnergy();
    if (measured !== null) {
      voiceEnergy = lerp(voiceEnergy, measured, measured > voiceEnergy ? 0.48 : 0.16);
      amp = lerp(amp, voiceEnergy, voiceEnergy > amp ? 0.54 : 0.14);
    } else if (voiceActive) {
      // El sintetizador nativo del navegador no expone su señal: usa pulsos de palabra.
      speakClock += 0.42;
      const fallback = Math.max(voiceEnergy, 0.24 + 0.22 * Math.abs(Math.sin(speakClock)));
      voiceEnergy = lerp(voiceEnergy, 0, 0.12);
      amp = lerp(amp, fallback, 0.28);
    } else {
      voiceEnergy = lerp(voiceEnergy, 0, 0.18);
      amp = lerp(amp, 0, 0.10);
    }

    rot += curSpin * (reduceMotion ? 0.2 : 1) * 0.016;

    const cx = W / 2, cy = H * 0.46;
    const R = Math.min(W, H) * 0.30;
    const breathe = reduceMotion ? 0 : Math.sin(t * 1.1) * 0.02;
    const baseR = R * (1 + breathe + curExpand + amp * 0.10);
    const rgbCol = `${col.r | 0},${col.g | 0},${col.b | 0}`;
    const pulse = 0.5 + 0.5 * Math.sin(t * 1.6);
    const activity = Math.min(1, (curTurb - 0.75) / 1.2);

    drawEnvironment(cx, cy, R, rgbCol, activity, pulse);
    paintSprite(col.r, col.g, col.b);
    drawCore(cx, cy, R, rgbCol, pulse);          // núcleo detrás del enjambre

    // ── enjambre: posiciones (con profundidad + arranque) + halos ──
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < N; i++) {
      const p = P[i];
      const a = p.a + rot * p.spd;
      const n = noise(a * (0.9 + curChaos * 0.15) + p.seed, t * (0.8 + curChaos * 0.35));
      const disp = n * curTurb * R * 0.16 + p.band * R + amp * Math.sin(a * 8 + t * 6) * R * 0.05;
      let rr = baseR + disp;
      if (boot < 1) rr = lerp(p.scatter * R, rr, boot);   // arranque: converge al anillo
      const cosa = Math.cos(a), sina = Math.sin(a);
      const x = cx + cosa * rr;
      const y = cy + sina * rr * TILT;                     // inclinación → profundidad
      const depth = 0.55 + 0.45 * (sina * 0.5 + 0.5);      // fondo más tenue/pequeño
      const flick = 0.65 + 0.35 * Math.sin(t * 3 * p.spd + p.seed);
      const s = p.sz * (1 + amp * 0.35) * (0.7 + depth * 0.5);
      p._x = x; p._y = y; p._f = flick * depth * boot; p._s = s;

      const glowPx = s * 2.55;
      ctx.globalAlpha = p.bri * flick * depth * boot * 0.42;
      ctx.drawImage(sprite, x - glowPx / 2, y - glowPx / 2, glowPx, glowPx);
    }

    // ── filamentos continuos: ondas orgánicas, nunca conexiones tipo constelación ──
    ctx.strokeStyle = `rgb(${rgbCol})`;
    ctx.lineWidth = 0.65;
    for (let lane = 0; lane < 4; lane++) {
      ctx.globalAlpha = (0.075 - lane * 0.011) * boot;
      ctx.beginPath();
      for (let j = 0; j <= 220; j++) {
        const a = (j / 220) * TAU;
        const wave = noise(a * (1.4 + lane * 0.17) + lane, t * 0.72);
        const rr = baseR + wave * R * (0.075 + lane * 0.009)
          + Math.sin(a * (4 + lane) - t * (0.8 + lane * 0.1)) * R * 0.018;
        const x = cx + Math.cos(a) * rr;
        const y = cy + Math.sin(a) * rr * TILT;
        if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.stroke();
    }

    // ── núcleos sólidos nítidos ──
    ctx.fillStyle = coreHex;
    for (let i = 0; i < N; i++) {
      const p = P[i];
      ctx.globalAlpha = Math.min(0.86, p.bri * p._f * 0.92);
      ctx.beginPath(); ctx.arc(p._x, p._y, Math.max(0.42, p._s * 0.42), 0, TAU); ctx.fill();
    }

    // ── flares de ejecución (elipses inclinadas) ──
    for (let i = pulses.length - 1; i >= 0; i--) {
      const pu = pulses[i];
      pu.r += 8; pu.life -= 0.02;
      if (pu.life <= 0) { pulses.splice(i, 1); continue; }
      ctx.globalAlpha = pu.life * 0.5; ctx.lineWidth = 2;
      const rr = baseR + pu.r;
      ctx.beginPath(); ctx.ellipse(cx, cy, rr, rr * TILT, 0, 0, TAU); ctx.stroke();
    }

    // ── bloom: copia difusa a baja resolución, sumada encima ──
    if (glow.width !== ((W / 4) | 0) || glow.height !== ((H / 4) | 0)) sizeGlow();
    gctx.clearRect(0, 0, glow.width, glow.height);
    gctx.drawImage(canvas, 0, 0, glow.width, glow.height);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.28; ctx.imageSmoothingEnabled = true;
    ctx.drawImage(glow, 0, 0, glow.width, glow.height, 0, 0, W, H);

    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ── Consola ──
  function addLine(who, text, cls) {
    const line = document.createElement("div"); line.className = "line " + (cls || "");
    const w = document.createElement("div"); w.className = "who"; w.textContent = who;
    const x = document.createElement("div"); x.className = "txt"; x.textContent = text;
    line.appendChild(w); line.appendChild(x); logEl.appendChild(line);
    focusRecentHistory();
    logEl.scrollTop = logEl.scrollHeight;
    return { line, text: x };
  }

  function focusRecentHistory() {
    const lines = Array.from(logEl.querySelectorAll(".line"));
    logEl.classList.toggle("has-history", lines.length > 3);
    const current = lines.length - 1;
    for (let i = 0; i < lines.length; i++) {
      const distance = current - i;
      lines[i].classList.remove("history-current", "history-near", "history-mid", "history-old");

      if (m.type === "state") setState(m.state);
      else if (m.type === "emotion") setEmotion(m.emotion);
      else if (m.type === "event") firePulse();
      else if (m.type === "tool_event") { showToolEvent(m); firePulse(); }
      else if (m.type === "reply_start") startStreamReply();
      else if (m.type === "reply_delta") appendStreamDelta(m.delta);
      else if (m.type === "reply") { finishStreamReply(m.reply); if (m.tools_used && m.tools_used.length) firePulse(); }
      else if (m.type === "error") { finishStreamReply(); addLine("SISTEMA", m.error || "Error del servidor.", "system"); setEmotion("concern"); }
      else if (m.type === "proactive") { addLine("JARVIS", "⚡ " + m.text, "jarvis"); speak(m.text); firePulse(); }
      else if (m.type === "approval_required") {
        pendingApproval = m;
        showToolEvent({ phase: "awaiting", tool: m.tool, arguments: m.arguments });
        approvalActions.hidden = false;
        approvalApprove.disabled = false; approvalDeny.disabled = false;
        setBusy(false);
        setState("idle"); setEmotion("alert");
        messageInput.placeholder = "Esperando tu decisión…";
        addLine("SISTEMA", "PERMISO REQUERIDO · " + m.summary + " Usa los botones del espacio de trabajo.", "system");
      }
      else if (m.type === "approval_invalid") {
        setBusy(false);
        approvalActions.hidden = false;
        approvalApprove.disabled = false; approvalDeny.disabled = false;
        messageInput.placeholder = "Esperando tu decisión…";
        addLine("SISTEMA", m.message || "Confirmación inválida.", "system");

        approvalActions.hidden = true;

          if (!m.approved) showToolEvent({ phase: "denied", tool: pendingApproval.tool, arguments: pendingApproval.arguments });
          pendingApproval = null;
        }
        addLine("SISTEMA", m.approved ? "Permiso concedido." : "Permiso denegado.", "system");
        setBusy(true);
      }
    };
  }

  function connectVoiceVisualizer(audio) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    try {
      if (!audioContext) audioContext = new AudioContextClass();
      const source = audioContext.createMediaElementSource(audio);
      voiceAnalyser = audioContext.createAnalyser();
      voiceAnalyser.fftSize = reduceMotion ? 256 : 512;
      voiceAnalyser.smoothingTimeConstant = 0.58;
      voiceWaveform = new Uint8Array(voiceAnalyser.fftSize);
      source.connect(voiceAnalyser);
      voiceAnalyser.connect(audioContext.destination);
      audioContext.resume().catch(() => {});
    } catch {
      voiceAnalyser = null;
      voiceWaveform = null;
    }
  }

  async function refreshVoiceStatus() {

  function selectSpanishVoice() {
    const voices = speechSynthesis.getVoices();
    const spanish = voices.filter((voice) => /^es([_-]|$)/i.test(voice.lang));
    return spanish.find((voice) => /jorge|diego|carlos|male|mascul/i.test(voice.name))
      || spanish.find((voice) => /premium|enhanced|natural/i.test(voice.name))
      || spanish[0] || voices[0] || null;
  }

  function prepareSpeechText(text) {
    return String(text)
      .replace(/&amp;/gi, " y ")
      .replace(/&(?:lt|gt|quot|apos);/gi, " ")
      .replace(/```[\s\S]*?```/g, " ")
      .replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1")
      .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
      .replace(/<https?:\/\/[^>]+>/g, " ")
      .replace(/https?:\/\/\S+/g, " ")
      .replace(/`([^`]*)`/g, "$1")
      .replace(/^\s{0,3}(?:#{1,6}|>|[-+*]|\d+[.)])\s+/gm, "")
      .replace(/^\s*\|?(?:\s*:?-{3,}:?\s*\|)+\s*$/gm, " ")
      .replace(/\|/g, ". ")
      .replace(/[*_~#`]/g, "")
      .replace(/[{}\[\]\\]/g, " ")
      .replace(/[•▪◦►▶]+/g, " ")
      .replace(/\s+/g, " ")
      .replace(/\s+([,.;:!?])/g, "$1")
      .trim();
  }

  function speakInBrowser(text, cancelExisting = true) {
    return new Promise((resolve) => {
      if (!canSpeak) { rVoice.textContent = "ERROR"; resolve(); return; }
      if (cancelExisting) speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "es-MX";
      utterance.rate = 0.96;
      utterance.pitch = 0.82;
      const voice = selectSpanishVoice();
      if (voice) utterance.voice = voice;
      utterance.onstart = () => { stopWakeListening(); voiceActive = true; voiceEnergy = 0.35; rVoice.textContent = "HABLANDO"; setState("speaking"); };
      utterance.onboundary = () => { voiceEnergy = Math.max(voiceEnergy, 0.72); };
      utterance.onend = () => { voiceActive = false; rVoice.textContent = "LISTA"; scheduleWakeListening(); resolve(); };
      utterance.onerror = () => { voiceActive = false; rVoice.textContent = "ERROR"; scheduleWakeListening(); resolve(); };
      speechSynthesis.speak(utterance);
    });
  }

  function cancelSpeechQueue() {
    speechSession += 1;
    speechQueue = [];
    streamSpeechBuffer = "";
    streamSpeechSource = "";
    if (canSpeak) speechSynthesis.cancel();
    if (stopCurrentAudio) stopCurrentAudio();
    voiceActive = false;
    voiceAnalyser = null;
    voiceWaveform = null;

  async function requestSpeechAudio(text, session) {
    const response = await fetch(`${gatewayHttpBase()}/voice/synthesize`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Jarvis-Key": tokenInput.value,
        },
        body: JSON.stringify({ text }),
      });
    if (!response.ok) throw new Error(`TTS ${response.status}`);
    const audioUrl = URL.createObjectURL(await response.blob());
    if (session !== speechSession || !voiceEnabled) {
      URL.revokeObjectURL(audioUrl);
      return null;
    }
    return audioUrl;
  }

  function playAudioUrl(audioUrl, session) {
    return new Promise((resolve, reject) => {
      if (!audioUrl || session !== speechSession || !voiceEnabled) { resolve(); return; }
      let settled = false;
      const finish = (error = null) => {
        if (settled) return;
        settled = true;
        URL.revokeObjectURL(audioUrl);
        currentAudio = null;
        stopCurrentAudio = null;
        voiceActive = false;
        voiceAnalyser = null;
        voiceWaveform = null;
        if (error) reject(error); else resolve();
      };
      currentAudio = new Audio(audioUrl);
      connectVoiceVisualizer(currentAudio);
      stopCurrentAudio = () => { currentAudio?.pause(); finish(); };
      currentAudio.onplay = () => { stopWakeListening(); voiceActive = true; rVoice.textContent = "HABLANDO"; setState("speaking"); };
      currentAudio.onended = () => finish();
      currentAudio.onerror = () => finish(new Error("audio"));
      currentAudio.play().catch((error) => finish(error));
    });
  }

  async function runSpeechQueue() {
    if (speechQueueRunning) return;
    speechQueueRunning = true;
    while (speechQueue.length) {
      const item = speechQueue.shift();
      if (item.session !== speechSession || !voiceEnabled) continue;
      try {
        const audioUrl = await item.audio;
        await playAudioUrl(audioUrl, item.session);
      } catch {
        serverVoiceAvailable = false;
        await speakInBrowser(item.text, false);
      }
    }
    speechQueueRunning = false;
    if (voiceEnabled) rVoice.textContent = serverVoiceAvailable ? "LOCAL" : "NAVEGADOR";
    setState("idle");
    scheduleWakeListening();
  }

  function enqueueSpeech(text) {
    const spokenText = prepareSpeechText(text);
    if (!voiceEnabled || !spokenText) return;
    if (!serverVoiceAvailable) { speakInBrowser(spokenText, false); return; }
    const session = speechSession;
    rVoice.textContent = "SINTETIZANDO";
    // La descarga comienza ahora; la cola solo controla el orden de reproducción.
    speechQueue.push({ session, text: spokenText, audio: requestSpeechAudio(spokenText, session) });
    runSpeechQueue();
  }

  function flushStreamSpeech(force = false) {
    if (!serverVoiceAvailable) return;
    while (streamSpeechBuffer.trim()) {
      const sentence = streamSpeechBuffer.match(/^[\s\S]*?[.!?](?:["'»”)]?)(?:\s|$)/);
      let cut = sentence?.[0].length || 0;
      if (!cut && streamSpeechBuffer.length >= 180) {
        cut = streamSpeechBuffer.lastIndexOf(" ", 180);
        if (cut < 100) cut = 180;
      }
      if (!cut && force) cut = streamSpeechBuffer.length;
      if (!cut) break;
      enqueueSpeech(streamSpeechBuffer.slice(0, cut));
      streamSpeechBuffer = streamSpeechBuffer.slice(cut);
    }
  }

  function beginStreamSpeech() {
    cancelSpeechQueue();
    streamSpeechBuffer = "";
    streamSpeechSource = "";
  }

  function appendStreamSpeech(delta) {
    streamSpeechSource += delta;
    streamSpeechBuffer += delta;
    flushStreamSpeech(false);
  }

  function finishStreamSpeech(finalText) {
    if (!voiceEnabled) return;
    if (!serverVoiceAvailable) { speak(finalText); return; }
    if (finalText !== streamSpeechSource) {
      // Si el mensaje final corrigió el stream, prioriza la versión autoritativa.
      cancelSpeechQueue();
      streamSpeechBuffer = finalText;
    }
    flushStreamSpeech(true);
  }

  async function speak(text) {
    const spokenText = prepareSpeechText(text);
    if (!voiceEnabled || !spokenText) return;
    cancelSpeechQueue();
    if (!serverVoiceAvailable) { await speakInBrowser(spokenText); return; }
    enqueueSpeech(spokenText);
    try {
      await runSpeechQueue();
    } catch {
      serverVoiceAvailable = false;
      await speakInBrowser(spokenText);
    }
  }

  function normalizeWakeText(text) {
    return text.toLocaleLowerCase("es").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function wakeCommand(text) {
    // Web Speech suele representar "Hey" como "ey/ei" y "Jarvis" como "Yarvis".
    const match = normalizeWakeText(text).match(/(?:^|\s)(?:hey|ey|ei|oye)\s+(?:jarvis|yarvis)\b[\s,.:;!?-]*(.*)$/i);
    return match ? match[1].trim() : null;
  }

  async function playWakeChime() {
    if (!voiceEnabled) return;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    try {
      if (!audioContext) audioContext = new AudioContextClass();
      await audioContext.resume();
      const now = audioContext.currentTime;
      const gain = audioContext.createGain();
      const low = audioContext.createOscillator();
      const high = audioContext.createOscillator();
      low.type = "sine"; high.type = "triangle";
      low.frequency.setValueAtTime(260, now);
      low.frequency.exponentialRampToValueAtTime(610, now + 0.32);
      high.frequency.setValueAtTime(420, now + 0.05);
      high.frequency.exponentialRampToValueAtTime(920, now + 0.30);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.035);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
      low.connect(gain); high.connect(gain); gain.connect(audioContext.destination);
      low.start(now); high.start(now + 0.05);
      low.stop(now + 0.43); high.stop(now + 0.40);
      voiceEnergy = Math.max(voiceEnergy, 0.72);
      await new Promise((resolve) => setTimeout(resolve, 440));
    } catch {
      // La activación sigue funcionando aunque el navegador bloquee el tono.
    }
  }

  function stopWakeListening() {
    clearTimeout(wakeRestartTimer); wakeRestartTimer = null;
    wakeListening = false;
    if (wakeRecognition) {
      wakeRecognition.onend = null;
      wakeRecognition.onerror = null;
      try { wakeRecognition.abort(); } catch {}
    }
    wakeRecognition = null;
  }

  function scheduleWakeListening(delay = 450) {
    clearTimeout(wakeRestartTimer);
    if (!SpeechRecognition || !ws || ws.readyState !== WebSocket.OPEN || busy || voiceActive || speechQueueRunning || recorder?.state === "recording") return;
    wakeRestartTimer = setTimeout(startWakeListening, delay);
  }

  function startWakeListening() {
    if (!SpeechRecognition || busy || voiceActive || wakeListening) return;
    wakeRecognition = new SpeechRecognition();
    wakeRecognition.lang = "es-MX";
    wakeRecognition.interimResults = true;
    wakeRecognition.continuous = true;
    wakeRecognition.onstart = () => {
      wakeListening = true;
      setMicActive(true, "HEY JARVIS");
      setState("idle");
    };
    wakeRecognition.onresult = async (event) => {
      let heard = "";
      let finalResult = false;
      for (let i = 0; i < event.results.length; i++) {
        heard += " " + event.results[i][0].transcript;
        finalResult ||= event.results[i].isFinal;
      }
      const command = wakeCommand(heard);
      if (command === null) return;
      // Espera el resultado final para no perder una pregunta dicha en la misma frase.
      if (!finalResult) return;
      firePulse();
      stopWakeListening();
      setMicActive(false, "ACTIVADO");
      await playWakeChime();
      if (command) {
        messageInput.value = command;
        document.getElementById("form").requestSubmit();
      } else if (serverVoiceAvailable && canRecord) {
        startServerRecording({ automatic: true });
      } else {
        recognition?.start();
      }
    };
    wakeRecognition.onend = () => {
      wakeListening = false;
      wakeRecognition = null;
      scheduleWakeListening(350);
    };
    wakeRecognition.onerror = (event) => {
      wakeListening = false;
      wakeRecognition = null;
      if (!["no-speech", "aborted"].includes(event.error)) {
        rVoice.textContent = event.error === "not-allowed" ? "PERMISO MICRÓFONO" : "ERROR DE MICRÓFONO";
        micButton.classList.add("permission-needed");
      }
      scheduleWakeListening(event.error === "not-allowed" ? 10000 : 800);
    };
    try { wakeRecognition.start(); } catch { scheduleWakeListening(1000); }
  }

  function stopRecorderVad() {
    if (recorderVadFrame) cancelAnimationFrame(recorderVadFrame);
    recorderVadFrame = null;
    recorderAudioContext?.close().catch(() => {});
    recorderAudioContext = null;
  }

  function monitorQuestionSilence(stream) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    recorderAudioContext = new AudioContextClass();
    const source = recorderAudioContext.createMediaStreamSource(stream);
    const analyser = recorderAudioContext.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.35;
    source.connect(analyser);
    const samples = new Uint8Array(analyser.fftSize);
    const startedAt = performance.now();
    let speechStarted = false;
    let lastVoiceAt = startedAt;
    const detect = () => {
      if (recorder?.state !== "recording") return;
      analyser.getByteTimeDomainData(samples);
      let sum = 0;
      for (const value of samples) {
        const sample = (value - 128) / 128;
        sum += sample * sample;
      }
      const rms = Math.sqrt(sum / samples.length);
      const now = performance.now();
      if (rms > 0.028) {
        speechStarted = true;
        lastVoiceAt = now;
        rVoice.textContent = "ESCUCHANDO";
      }
      // Da tiempo a empezar y cierra la pregunta tras 1.25 s de silencio natural.
      if ((speechStarted && now - lastVoiceAt > 1250) || (!speechStarted && now - startedAt > 6500)) {
        recorder.stop();
        return;
      }
      recorderVadFrame = requestAnimationFrame(detect);
    };
    recorderVadFrame = requestAnimationFrame(detect);
  }

  async function startServerRecording({ automatic = false } = {}) {
    stopWakeListening();
    try {
      recorderStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
      recorderChunks = [];
      const mimeType = recordingMimeType();
      recorder = mimeType ? new MediaRecorder(recorderStream, { mimeType }) : new MediaRecorder(recorderStream);
      recorder.ondataavailable = (event) => { if (event.data.size) recorderChunks.push(event.data); };
      recorder.onstop = () => {
        clearTimeout(recorderTimer); recorderTimer = null;
        stopRecorderVad();
        recorderStream?.getTracks().forEach((track) => track.stop()); recorderStream = null;
        const blob = new Blob(recorderChunks, { type: recorder.mimeType || mimeType || "audio/webm" });
        recorder = null; recorderChunks = []; setMicActive(false, "TRANSCRIBIENDO");
        if (blob.size) sendRecordedAudio(blob);
      };
      recorder.start(250);
      setMicActive(true, automatic ? "ESCUCHANDO" : "GRABANDO");
      if (automatic) monitorQuestionSilence(recorderStream);
      recorderTimer = setTimeout(() => { if (recorder?.state === "recording") recorder.stop(); }, 20000);
    } catch (error) {
      setMicActive(false, "ERROR");
      addLine("SISTEMA", "No pude acceder al micrófono: " + error.message, "system");
      scheduleWakeListening();
    }
  }

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "es-MX";
    recognition.interimResults = true;
    recognition.continuous = false;
    recognition.onstart = () => {
      setMicActive(true, "ESCUCHANDO");
    };
    recognition.onresult = (event) => {
      let transcript = "";
      let isFinal = false;
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
        isFinal ||= event.results[i].isFinal;
      }
      messageInput.value = transcript.trim();
      if (isFinal && messageInput.value) document.getElementById("form").requestSubmit();
    };
    recognition.onend = () => {
      setMicActive(false, serverVoiceAvailable ? "LOCAL" : "NAVEGADOR");
    };
    recognition.onerror = (event) => {
      if (event.error !== "no-speech" && event.error !== "aborted") {
        addLine("SISTEMA", "No pude acceder al micrófono: " + event.error, "system");
      }
    };
  }

  micButton.addEventListener("click", () => {
    if (recorder?.state === "recording") { recorder.stop(); return; }
    if (busy) return;
    if (SpeechRecognition) {
      micButton.classList.remove("permission-needed");
      stopWakeListening();
      startWakeListening();
      addLine("SISTEMA", "Escucha de «Hey Jarvis» reiniciada.", "system");
    } else if (serverVoiceAvailable && canRecord) startServerRecording();
    else addLine("SISTEMA", "Este navegador no permite capturar voz.", "system");
  });

  if (!canRecord && !SpeechRecognition) {
    micButton.disabled = true;
    micButton.title = "Captura de voz no disponible en este navegador";
  }

  document.querySelectorAll("[data-state]").forEach((b) => b.addEventListener("click", () => setState(b.dataset.state)));
  document.querySelectorAll("[data-emotion]").forEach((b) => b.addEventListener("click", () => setEmotion(b.dataset.emotion)));
  document.getElementById("pulse").addEventListener("click", firePulse);

  document.getElementById("ws-connect").addEventListener("click", () => connect(FIXED_WS_URL, tokenInput.value));
  tokenInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") connect(FIXED_WS_URL, tokenInput.value);
  });
})();
</script>
</body>
</html>
