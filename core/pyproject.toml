[project]
name = "jarvis-core"
version = "0.1.0"
description = "El núcleo agéntico de JARVIS_OS: orquestador multiagente, herramientas, memoria y voz."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "certifi>=2024.7.4",
    "cryptography>=43.0",
]

[project.optional-dependencies]
# Proveedores compatibles con OpenAI (NVIDIA NIM, Ollama, etc.)
openai = [
    # Realtime client secrets and GPT-Realtime-2.1 require the current SDK.
    "openai>=3.0.0",
]
voice = [
    "faster-whisper>=1.1",
    # Kokoro-82M: motor TTS por defecto (natural y rápido en CPU).
    # Necesita el binario del sistema `espeak-ng` para fonemizar español.
    "kokoro==0.9.4",
    "soundfile>=0.12",
    "numpy>=1.26",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
jarvis = "jarvis_core.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
